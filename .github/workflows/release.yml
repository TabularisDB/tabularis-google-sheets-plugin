name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Validate the checked-in release metadata before building artifacts.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag matches manifest version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(jq -r .version .tabularium)" = "$version" || { echo '::error::Tag and manifest versions differ'; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload manifest as artifact
        uses: actions/upload-artifact@v4
        with:
          name: manifest
          path: .tabularium
          include-hidden-files: true

      - name: Extract release notes
        run: |
          awk -v ver="${GITHUB_REF_NAME#v}" '
            /^## \[/ { line=$0; sub(/^## \[/,"",line); sub(/\].*/,"",line); if (capturing) exit; if (line==ver) { capturing=1; found=1; next } }
            capturing { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md

      - name: Upload release notes as artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  # ── 2. UI bundle ───────────────────────────────────────────────────
  ui:
    name: ui-bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install UI deps
        run: pnpm --dir ui install --frozen-lockfile

      - name: Build UI
        run: pnpm --dir ui build

      - name: Upload UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist/

  # ── 3. Build matrix ────────────────────────────────────────────────
  build:
    name: ${{ matrix.platform-label }}
    needs: [prepare, ui]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform-label: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: zip
            binary-suffix: ""
          - platform-label: linux-arm64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: zip
            binary-suffix: ""
            cross: true
          - platform-label: darwin-x64
            runner: macos-latest
            target: x86_64-apple-darwin
            archive: zip
            binary-suffix: ""
          - platform-label: darwin-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            archive: zip
            binary-suffix: ""
          - platform-label: win-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            binary-suffix: ".exe"

    steps:
      - uses: actions/checkout@v4

      - name: Download manifest artifact
        uses: actions/download-artifact@v4
        with:
          name: manifest

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (linux-arm64 only)
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Download UI artifact
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist/

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          STAGE=staging
          mkdir -p "$STAGE/ui/dist"
          cp target/${{ matrix.target }}/release/google-sheets-plugin${{ matrix.binary-suffix }} "$STAGE/"
          cp .tabularium "$STAGE/"
          cp ui/dist/*.js "$STAGE/ui/dist/"
          (cd "$STAGE" && zip -r ../google-sheets-plugin-${{ matrix.platform-label }}.zip .)

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "staging"
          New-Item -ItemType Directory -Force -Path "$stage\ui\dist" | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\google-sheets-plugin${{ matrix.binary-suffix }}" $stage
          Copy-Item ".tabularium" $stage
          Copy-Item "ui\dist\*.js" "$stage\ui\dist\"
          Compress-Archive -Path "$stage\*" -DestinationPath "google-sheets-plugin-${{ matrix.platform-label }}.zip"

      - name: Smoke test binary (Unix)
        if: runner.os != 'Windows' && !matrix.cross
        run: |
          response=$(echo '{"jsonrpc":"2.0","method":"initialize","id":1}' | ./staging/google-sheets-plugin)
          echo "$response" | jq -e 'has("result") and (has("error") | not)' > /dev/null

      - name: Smoke test binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $response = '{"jsonrpc":"2.0","method":"initialize","id":1}' | & ".\staging\google-sheets-plugin.exe"
          $parsed = $response | ConvertFrom-Json
          if ($null -ne $parsed.error -or -not ($parsed.PSObject.Properties.Name -contains 'result')) { throw 'Invalid initialize response' }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: google-sheets-plugin-${{ matrix.platform-label }}
          path: google-sheets-plugin-${{ matrix.platform-label }}.zip

  # ── 4. Create GitHub Release ───────────────────────────────────────
  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Detect prerelease
        id: meta
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/*.zip
            artifacts/.tabularium
          generate_release_notes: false
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.meta.outputs.prerelease == 'false' }}
